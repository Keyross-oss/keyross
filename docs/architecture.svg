<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" font-family="Inter, Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#1A2C4E"/></marker></defs>
<rect x="0" y="0" width="1600" height="1180" fill="#FFFFFF"/>
<text x="800.0" y="46" font-size="34" font-weight="700" text-anchor="middle" fill="#1A2C4E">Where gauges run — two yokes, scrutineering, the same lock</text>
<text x="800.0" y="82" font-size="21" font-style="italic" text-anchor="middle" fill="#6A7179">a gauge is code a model never reads: official validators homologated, your own oracles, bad cases — pinned in keyross.lock</text>
<rect x="60" y="110" width="1480" height="150" rx="12" fill="#F7F7F7" stroke="#1A2C4E" stroke-width="3"/>
<text x="80" y="146" font-size="24" font-weight="700" text-anchor="start" fill="#1A2C4E">THE REGISTRY — keyross add · update · outdated</text>
<rect x="80" y="166" width="272" height="78" rx="12" fill="#FFFFFF" stroke="#2C6E78" stroke-width="2.5"/>
<text x="94" y="194" font-size="21" font-weight="700" text-anchor="start" fill="#1A2C4E">core</text>
<text x="94" y="218" font-size="15" font-style="italic" text-anchor="start" fill="#6A7179">universal invariants</text>
<rect x="372" y="166" width="272" height="78" rx="12" fill="#FFFFFF" stroke="#2C6E78" stroke-width="2.5"/>
<text x="386" y="194" font-size="21" font-weight="700" text-anchor="start" fill="#1A2C4E">einvoice</text>
<text x="386" y="218" font-size="15" font-style="italic" text-anchor="start" fill="#6A7179">official EN 16931 Schematron</text>
<text x="386" y="238" font-size="15" font-style="italic" text-anchor="start" fill="#6A7179">homologated + delta oracles</text>
<rect x="664" y="166" width="272" height="78" rx="12" fill="#FFFFFF" stroke="#2C6E78" stroke-width="2.5"/>
<text x="678" y="194" font-size="21" font-weight="700" text-anchor="start" fill="#1A2C4E">dora.register</text>
<text x="678" y="218" font-size="15" font-style="italic" text-anchor="start" fill="#6A7179">ESAs rules homologated + delta</text>
<rect x="956" y="166" width="272" height="78" rx="12" fill="#FFFFFF" stroke="#2C6E78" stroke-width="2.5"/>
<text x="970" y="194" font-size="21" font-weight="700" text-anchor="start" fill="#1A2C4E">governance</text>
<text x="970" y="218" font-size="15" font-style="italic" text-anchor="start" fill="#6A7179">evidence on the telemetry</text>
<rect x="1248" y="166" width="272" height="78" rx="12" fill="#FFFFFF" stroke="#2C6E78" stroke-width="2.5"/>
<text x="1262" y="194" font-size="21" font-weight="700" text-anchor="start" fill="#1A2C4E">yours</text>
<text x="1262" y="218" font-size="15" font-style="italic" text-anchor="start" fill="#6A7179">your oracles + reference data</text>
<line x1="800" y1="260" x2="800" y2="300" stroke="#1A2C4E" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="340" y="304" width="920" height="70" rx="12" fill="#FFF8E7" stroke="#B08A2E" stroke-width="4"/>
<text x="800" y="334" font-size="20" font-weight="700" text-anchor="middle" fill="#1A2C4E">INSTALLED GAUGES — pinned in keyross.lock: ids, versions, checksums of official artifacts</text>
<text x="800" y="360" font-size="16" font-style="italic" text-anchor="middle" fill="#6A7179">deployed where the documents are — your machine, your CI, your cluster — never a SaaS that receives files</text>
<line x1="800" y1="374" x2="330" y2="424" stroke="#1A2C4E" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="800" y1="374" x2="900" y2="424" stroke="#1A2C4E" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="800" y1="374" x2="1370" y2="424" stroke="#1A2C4E" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="60" y="430" width="540" height="420" rx="12" fill="#FFFFFF" stroke="#1A2C4E" stroke-width="3"/>
<text x="80" y="464" font-size="23" font-weight="700" text-anchor="start" fill="#1A2C4E">1 · THE YOKE, INSIDE THE HARNESS</text>
<text x="80" y="490" font-size="16" font-style="italic" text-anchor="start" fill="#6A7179">Deep Agents · LangGraph · custom loop · Claude Code hook</text>
<rect x="80" y="510" width="500" height="66" rx="12" fill="#F7F7F7" stroke="#1A2C4E" stroke-width="2"/>
<text x="94" y="536" font-size="15" text-anchor="start" fill="#1F2933">model → plan → writing tool on the working copy</text>
<text x="94" y="558" font-size="15" text-anchor="start" fill="#1F2933">the model never sees the gauges: not in the prompt, not in tools</text>
<line x1="330" y1="576" x2="330" y2="606" stroke="#1A2C4E" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="80" y="610" width="500" height="96" rx="12" fill="#E3EEF0" stroke="#2C6E78" stroke-width="2.5"/>
<text x="94" y="636" font-size="15" font-weight="700" text-anchor="start" fill="#1F2933">KeyrossMiddleware — wrap_tool_call, after the tool</text>
<text x="94" y="658" font-size="15" text-anchor="start" fill="#1F2933">runs the gauges on the copy: invariants, contracts, sentinels</text>
<text x="94" y="680" font-size="15" text-anchor="start" fill="#1F2933">red → pit stop (revert + category) · green → continue</text>
<line x1="330" y1="706" x2="330" y2="736" stroke="#1A2C4E" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="80" y="740" width="500" height="60" rx="12" fill="#FFFFFF" stroke="#1A2C4E" stroke-width="2"/>
<text x="94" y="764" font-size="15" text-anchor="start" fill="#1F2933">Claude Code: PostToolUse hook → keyross check &lt;file written&gt;</text>
<text x="94" y="785" font-size="15" text-anchor="start" fill="#1F2933">code executed by the harness — not a skill the model reads</text>
<text x="80" y="830" font-size="15" font-style="italic" text-anchor="start" fill="#6A7179">verdicts → telemetry · the agent gets a flag + a category</text>
<rect x="630" y="430" width="540" height="420" rx="12" fill="#FFFFFF" stroke="#1A2C4E" stroke-width="3"/>
<text x="650" y="464" font-size="23" font-weight="700" text-anchor="start" fill="#1A2C4E">2 · THE YOKE, AS A SERVICE — MCP</text>
<text x="650" y="490" font-size="16" font-style="italic" text-anchor="start" fill="#6A7179">keyross serve --mcp · deployed at the client, offline</text>
<rect x="650" y="510" width="500" height="96" rx="12" fill="#E3EEF0" stroke="#2C6E78" stroke-width="2.5"/>
<text x="664" y="536" font-size="15" font-weight="700" text-anchor="start" fill="#1F2933">guard mode — called by the platform, not the model</text>
<text x="664" y="558" font-size="15" text-anchor="start" fill="#1F2933">invisible to the model; the platform enforces the verdict</text>
<text x="664" y="580" font-size="15" text-anchor="start" fill="#1F2933">this is the normal mode</text>
<rect x="650" y="618" width="500" height="96" rx="12" fill="#FFFFFF" stroke="#1A2C4E" stroke-width="2" stroke-dasharray="7,5"/>
<text x="664" y="644" font-size="15" font-weight="700" text-anchor="start" fill="#1F2933">tool mode — verify visible to the model</text>
<text x="664" y="666" font-size="15" text-anchor="start" fill="#1F2933">minimal feedback only; scrutineering stays mandatory</text>
<text x="664" y="688" font-size="15" text-anchor="start" fill="#1F2933">acceptable when the platform cannot host a guard</text>
<rect x="650" y="726" width="500" height="74" rx="12" fill="#F7F7F7" stroke="#1A2C4E" stroke-width="2"/>
<text x="664" y="752" font-size="15" text-anchor="start" fill="#1F2933">consumers: Claude platform, Codex, Deep Agents,</text>
<text x="664" y="774" font-size="15" text-anchor="start" fill="#1F2933">agent platforms, ERPs, e-invoicing platforms (OEM)</text>
<text x="650" y="830" font-size="15" font-style="italic" text-anchor="start" fill="#6A7179">the compiler is rented — never a SaaS that receives documents</text>
<rect x="1200" y="430" width="340" height="420" rx="12" fill="#FFFFFF" stroke="#1A2C4E" stroke-width="3"/>
<text x="1220" y="464" font-size="23" font-weight="700" text-anchor="start" fill="#1A2C4E">3 · SCRUTINEERING</text>
<text x="1220" y="490" font-size="16" font-style="italic" text-anchor="start" fill="#6A7179">CI · pipeline · Kubernetes Job</text>
<rect x="1220" y="510" width="300" height="120" rx="12" fill="#E3EEF0" stroke="#2C6E78" stroke-width="2.5"/>
<text x="1234" y="536" font-size="15" font-weight="700" text-anchor="start" fill="#1F2933">keyross gate outputs/</text>
<text x="1234" y="558" font-size="15" text-anchor="start" fill="#1F2933">replays every gauge on what</text>
<text x="1234" y="580" font-size="15" text-anchor="start" fill="#1F2933">leaves, from a fresh sandbox,</text>
<text x="1234" y="602" font-size="15" text-anchor="start" fill="#1F2933">outside the agent — exit 0/1/2</text>
<rect x="1220" y="642" width="300" height="96" rx="12" fill="#F7F7F7" stroke="#1A2C4E" stroke-width="2"/>
<text x="1234" y="668" font-size="15" font-weight="700" text-anchor="start" fill="#1F2933">agent green + gate red</text>
<text x="1234" y="690" font-size="15" text-anchor="start" fill="#1F2933">= black flag: integrity</text>
<text x="1234" y="712" font-size="15" text-anchor="start" fill="#1F2933">incident, run quarantined</text>
<text x="1220" y="770" font-size="15" font-style="italic" text-anchor="start" fill="#6A7179">nothing ships without its green</text>
<text x="1220" y="830" font-size="15" font-style="italic" text-anchor="start" fill="#6A7179">the door that needs no agent</text>
<line x1="330" y1="850" x2="330" y2="884" stroke="#1A2C4E" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="900" y1="850" x2="900" y2="884" stroke="#1A2C4E" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="1370" y1="850" x2="1370" y2="884" stroke="#1A2C4E" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="60" y="890" width="1480" height="220" rx="12" fill="#F7F7F7" stroke="#1A2C4E" stroke-width="3"/>
<text x="80" y="924" font-size="24" font-weight="700" text-anchor="start" fill="#1A2C4E">WHAT COMES OUT — the same contract from every door</text>
<rect x="80" y="944" width="272" height="140" rx="12" fill="#FFFFFF" stroke="#2C6E78" stroke-width="2.5"/>
<text x="94" y="972" font-size="20" font-weight="700" text-anchor="start" fill="#1A2C4E">Verdict</text>
<text x="94" y="998" font-size="15" text-anchor="start" fill="#1F2933">flag · category · evidence</text>
<text x="94" y="1020" font-size="15" text-anchor="start" fill="#1F2933">oracle_id@version · severity</text>
<text x="94" y="1042" font-size="15" text-anchor="start" fill="#1F2933">minimal() for the agent</text>
<rect x="372" y="944" width="272" height="140" rx="12" fill="#FFFFFF" stroke="#2C6E78" stroke-width="2.5"/>
<text x="386" y="972" font-size="20" font-weight="700" text-anchor="start" fill="#1A2C4E">keyross.lock</text>
<text x="386" y="998" font-size="15" text-anchor="start" fill="#1F2933">what verified this run:</text>
<text x="386" y="1020" font-size="15" text-anchor="start" fill="#1F2933">gauges, versions, checksums</text>
<text x="386" y="1042" font-size="15" text-anchor="start" fill="#1F2933">of official artifacts</text>
<rect x="664" y="944" width="272" height="140" rx="12" fill="#FFFFFF" stroke="#2C6E78" stroke-width="2.5"/>
<text x="678" y="972" font-size="20" font-weight="700" text-anchor="start" fill="#1A2C4E">Report</text>
<text x="678" y="998" font-size="15" text-anchor="start" fill="#1F2933">human-readable, nine sections</text>
<text x="678" y="1020" font-size="15" text-anchor="start" fill="#1F2933">deviations with evidence</text>
<text x="678" y="1042" font-size="15" text-anchor="start" fill="#1F2933">recommendations → oracles</text>
<rect x="956" y="944" width="272" height="140" rx="12" fill="#FFFFFF" stroke="#2C6E78" stroke-width="2.5"/>
<text x="970" y="972" font-size="20" font-weight="700" text-anchor="start" fill="#1A2C4E">Seal (0.3)</text>
<text x="970" y="998" font-size="15" text-anchor="start" fill="#1F2933">hash of the document + lock</text>
<text x="970" y="1020" font-size="15" text-anchor="start" fill="#1F2933">+ verdicts, signed</text>
<text x="970" y="1042" font-size="15" text-anchor="start" fill="#1F2933">the attestation, verifiable offline</text>
<rect x="1248" y="944" width="272" height="140" rx="12" fill="#FFFFFF" stroke="#2C6E78" stroke-width="2.5"/>
<text x="1262" y="972" font-size="20" font-weight="700" text-anchor="start" fill="#1A2C4E">Telemetry</text>
<text x="1262" y="998" font-size="15" text-anchor="start" fill="#1F2933">JSONL locally, ClickHouse</text>
<text x="1262" y="1020" font-size="15" text-anchor="start" fill="#1F2933">in production — the events</text>
<text x="1262" y="1042" font-size="15" text-anchor="start" fill="#1F2933">that audits and learning read</text>
</svg>