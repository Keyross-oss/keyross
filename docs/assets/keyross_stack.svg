<rect x="602" y="305" width="96" height="24" rx="5" fill="#ebe5d3" stroke="#8a948f" stroke-width="1.2"/><text x="650" y="322" fill="#5b6772">comments</text>
<rect x="602" y="334" width="96" height="24" rx="5" fill="#ebe5d3" stroke="#8a948f" stroke-width="1.2"/><text x="650" y="351" fill="#5b6772">pr</text>
<rect x="602" y="363" width="96" height="24" rx="5" fill="#ebe5d3" stroke="#8a948f" stroke-width="1.2"/><text x="650" y="380" fill="#5b6772">expense</text>
<rect x="602" y="392" width="96" height="24" rx="5" fill="#17212b"/><text x="650" y="409" fill="#faf7ec">einvoice</text>
