<text x="80" y="280">Claude · GPT · Gemini</text>
<text x="80" y="304">Mistral · open weights</text>
<text x="80" y="352">reason, plan, draft</text>
<text x="340" y="280">Claude Code</text>
<text x="340" y="304">Codex CLI · Gemini CLI</text>
<text x="340" y="328">LangChain · Deep Agents</text>
<text x="340" y="352">your own loop</text>
<text x="340" y="400">prompts, plans, writes</text>
<text x="1050" y="280">commits &amp; PRs</text>
<text x="1050" y="328">invoices &amp; docs</text>
<text x="1050" y="376">payments &amp; actions</text>
<text x="1050" y="424">the things you can&#x27;t</text>
<text x="1050" y="448">take back</text>
</g>
