<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="DejaVu Sans, Helvetica Neue, Arial, sans-serif">
<title>Where Keyross fits in your agent stack</title>
<rect width="1280" height="720" fill="#2b3238"/>
<text x="60" y="84" font-size="40" font-weight="bold" fill="#e9ecef">Where Keyross fits in your agent stack</text>
<text x="60" y="118" font-size="20" fill="#a7b0b8">Models think. Agents write. Keyross verifies — before anything leaves the loop.</text>
<rect x="60" y="170" width="230" height="300" rx="10" fill="#384047" stroke="#505860" stroke-width="2"/>
<text x="80" y="214" font-size="26" font-weight="bold" fill="#e9ecef">MODELS</text>
<text x="80" y="240" font-size="18" fill="#a7b0b8">think</text>
<rect x="320" y="170" width="230" height="300" rx="10" fill="#384047" stroke="#505860" stroke-width="2"/>
<text x="340" y="214" font-size="26" font-weight="bold" fill="#e9ecef">AGENTS</text>
<text x="340" y="240" font-size="18" fill="#a7b0b8">write</text>
<rect x="1030" y="170" width="190" height="300" rx="10" fill="#384047" stroke="#505860" stroke-width="2"/>
<text x="1050" y="214" font-size="26" font-weight="bold" fill="#e9ecef">THE WORLD</text>
<text x="1050" y="240" font-size="18" fill="#a7b0b8">ships</text>
<rect x="580" y="154" width="420" height="332" rx="14" fill="#faf7ec" stroke="#22a04a" stroke-width="4"/>
<text x="602" y="200" font-size="30" font-weight="bold" fill="#17212b">KEYROSS</text>
<text x="602" y="228" font-size="20" fill="#5b6772">verifies</text>
