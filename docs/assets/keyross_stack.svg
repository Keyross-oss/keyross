<text x="708" y="438">IBAN · master data · duplicates · sanctions</text>
</g>
<text x="602" y="466" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#22a04a">deterministic · rule ids · no model · locked</text>
<line x1="292" y1="320" x2="306" y2="320" stroke="#a7b0b8" stroke-width="3"/><polygon points="318,320 304,312 304,328" fill="#a7b0b8"/>
<line x1="552" y1="320" x2="566" y2="320" stroke="#a7b0b8" stroke-width="3"/><polygon points="578,320 564,312 564,328" fill="#a7b0b8"/>
<line x1="1002" y1="320" x2="1016" y2="320" stroke="#22a04a" stroke-width="4"/><polygon points="1028,320 1014,312 1014,328" fill="#22a04a"/>
<text x="1000" y="140" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#22a04a" text-anchor="middle">green: ships, with a report · audit receipt (planned)</text>
<path d="M 700 486 C 700 554, 440 554, 440 474" fill="none" stroke="#c8281b" stroke-width="3"/><polygon points="440,472 432,488 448,488" fill="#c8281b"/>
<text x="570" y="572" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#ff8a7a" text-anchor="middle">red: the write is reverted, the rule ids go back to the agent, it rewrites</text>
<rect x="60" y="590" width="373" height="100" rx="8" fill="#384047" stroke="#505860" stroke-width="2"/>
<text x="76" y="612" font-size="12" font-weight="bold" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#a7b0b8">DEV</text>
<text x="76" y="638" font-size="21" font-weight="bold" fill="#e9ecef">Review the verdicts, not the diff.</text>
<text x="76" y="664" font-size="13" fill="#a7b0b8">With rules (planned): 45 files → 3 red lines.</text>
<rect x="453" y="590" width="373" height="100" rx="8" fill="#384047" stroke="#505860" stroke-width="2"/>
<text x="469" y="612" font-size="12" font-weight="bold" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#a7b0b8">CFO</text>
<text x="469" y="638" font-size="21" font-weight="bold" fill="#e9ecef">Let the agent send it.</text>
<text x="469" y="664" font-size="13" fill="#a7b0b8">Measured on invoices: 33 → 0 official-rule</text>
<text x="469" y="681" font-size="13" fill="#a7b0b8">violations shipped per 100, with one model.</text>
<rect x="846" y="590" width="373" height="100" rx="8" fill="#384047" stroke="#505860" stroke-width="2"/>
<text x="862" y="612" font-size="12" font-weight="bold" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#a7b0b8">COMPLIANCE</text>
<text x="862" y="638" font-size="21" font-weight="bold" fill="#e9ecef">Evidence, not trust.</text>
<text x="862" y="664" font-size="13" fill="#a7b0b8">Report and lock, replayable by a third party.</text>
<text x="862" y="681" font-size="13" fill="#a7b0b8">Audit receipt (planned).</text>
<text x="60" y="712" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#a7b0b8">Tests verify it works. Keyross verifies what leaves the agent.   ·   pip install keyross   ·   keyross add einvoice</text>
</svg>
