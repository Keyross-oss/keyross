[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "keyross"
version = "0.1.1"
description = "Ready-to-use verifiers for your agent loop — official rules compiled into checks your agent must pass before it acts. Pinned, deterministic, replayable."
dynamic = ["readme"]                 # README.md, its links made absolute for PyPI (the fancy-pypi-readme hook below)
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Wassim Amri" }]
keywords = ["ai-agents", "llm-agents", "verifiers", "deterministic", "e-invoicing", "en16931", "deepagents", "langchain",
            "claude-code", "codex", "pre-commit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["openpyxl>=3.1", "pyyaml>=6.0"]

[project.optional-dependencies]
doctor = ["pyyaml>=6.0"]            # gitleaks / trivy / conftest are called as subprocesses when present
adapters = []                        # deepagents / langchain are imported lazily, never required
einvoice = ["saxonche>=12.5,<14"]    # Saxon-HE: runs the official CEN XSLT 2.0 artifacts offline
yoke = ["deepagents>=0.7,<0.8"]      # the Deep Agents / LangChain 1.x yoke
bench = ["lxml>=5"]                  # bench/einvoice: the schema judge (the validator judge runs in Docker)
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
keyross = "keyross.cli:main"

[project.urls]
Homepage = "https://github.com/Keyross-oss/keyross"
Changelog = "https://github.com/Keyross-oss/keyross/blob/main/CHANGELOG.md"
Issues = "https://github.com/Keyross-oss/keyross/issues"
Benchmark = "https://keyross-oss.github.io/keyross/bench/"
Citation = "https://doi.org/10.5281/zenodo.22938584"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI cannot resolve paths relative to the repository: images point to the raw files, links to the files on GitHub
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+\.(?:png|svg|gif|jpe?g))\)'
replacement = '](https://raw.githubusercontent.com/Keyross-oss/keyross/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/Keyross-oss/keyross/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/keyross"]

[tool.hatch.build]
include = ["src/keyross/**/*.py", "src/keyross/**/*.json", "src/keyross/**/*.yaml", "src/keyross/**/*.md",
           "src/keyross/gauges/*/rules/**",
           "src/keyross/gauges/*/badset/**"]            # a gauge ships its bad cases (docs/spec/gauge.md)

[tool.hatch.build.targets.sdist.force-include]
"README.md" = "README.md"            # the sdist keeps the README the description is built from

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
